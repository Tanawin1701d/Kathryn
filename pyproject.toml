[build-system]
requires      = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name            = "kathryn"
version         = "0.1.0"
description     = "Cycle-accurate hardware design in Python: control-flow blocks and resource abstractions, emitted as Verilog from a Rust core."
readme          = "README.md"                   # becomes the PyPI project page
license         = "Apache-2.0"
license-files   = ["LICENSE"]
requires-python = ">=3.9"
authors         = [{ name = "Tanawin", email = "tanawin1701d@outlook.com" }]
keywords        = ["hdl", "hardware", "verilog", "rtl", "eda", "fpga", "asic"]
classifiers     = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.urls]
Homepage      = "https://www.kathryn-tools.org/"
Documentation = "https://www.kathryn-tools.org/userbook/getting-started/introduction/"
Repository    = "https://github.com/Tanawin1701d/Kathryn"

[project.optional-dependencies]
dev = ["pytest"]
sim = ["cocotb>=2.0,<3", "verilator>=5.36"]     # the PyPI wheel; 5.048 reports as "5.48.0"

[tool.maturin]
# Build the PyO3 layer; the binding is gated behind this Cargo feature.
features    = ["python"]
# Mixed Rust/Python project: pure-Python package lives under py/, the compiled
# native extension is placed inside it as kathryn._kathryn, and py/kathryn/__init__.py
# re-exports it as the public DSL.
python-source = "py"
module-name   = "kathryn._kathryn"

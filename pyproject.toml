[build-system]
requires      = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name            = "kathryn"
version         = "0.1.0"
requires-python = ">=3.9"
classifiers     = ["Programming Language :: Rust"]

[tool.maturin]
# Build the PyO3 layer; the binding is gated behind this Cargo feature.
features    = ["python"]
module-name = "kathryn"
